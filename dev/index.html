<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>bookmark first (dev)</title>
    <link href="/popup/css/popup.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background-color: #444444;
      }
      .dev {
        padding: 24px;
      }
      .dev__fixtures {
        display: block;
        margin-bottom: 16px;
        font-size: 12px;
      }
      .dev__fixtures a {
        display: inline;
        margin-right: 12px;
        color: #06c;
      }
      .dev__fixtures a[data-current] {
        font-weight: bold;
        color: #ffffff;
      }
      .preview-area {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preview-area__inner {
        background-color: #ffffff;
        box-shadow: 0px 0px 8px #000000;
      }
    </style>
  </head>
  <body>
    <div class="dev">
      <nav class="js-dev-fixtures dev__fixtures"></nav>
      <div class="preview-area">
        <div class="preview-area__inner">
          <div class="wrapper">
            <ul class="list-root js-bookmark-root" data-empty="true"></ul>
            <div class="increment">
              <input
                class="js-increment increment__input"
                type="text"
                value=""
                placeholder="Input any keywords"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/dev/mock-chrome.ts"></script>
    <script type="module" src="/src/popup/popup.ts"></script>
    <script type="module" src="/dev/fixture-nav.ts"></script>
  </body>
</html>
